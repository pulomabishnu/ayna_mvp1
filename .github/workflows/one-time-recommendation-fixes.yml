name: One-time recommendation fixes

on:
  push:
    branches: [site-hardening-performance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-hardening-performance
          fetch-depth: 0

      - name: Apply exact scoring fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          products = Path('src/data/products.js')
          text = products.read_text()

          old = """const DIAGNOSIS_SPECIFIC_SIGNALS = [
              'pcos', 'pcos-management', 'endometriosis', 'fibroids', 'adenomyosis',
              'pmdd', 'thyroid', 'diabetes', 'insulin-resistance', 'hypertension',
              'migraine', 'anemia', 'ibs', 'autoimmune', 'anxiety', 'depression',
          ];"""
          new = """const DIAGNOSIS_SPECIFIC_SIGNALS = [
              'pcos', 'pcos-management', 'endometriosis', 'fibroids', 'adenomyosis',
              'pmdd', 'thyroid', 'diabetes', 'insulin-resistance', 'hypertension',
              'migraine', 'anemia', 'ibs', 'autoimmune', 'anxiety', 'depression',
              'bladder-leaks', 'bladder-leak-protection', 'incontinence',
          ];"""
          assert old in text, 'diagnosis signal block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """    const fsaAnswer = String(intake?.fsaHsaAnswer || intake?.fsaHsa || '');
              if (fsaAnswer && !['No', 'Not sure'].includes(fsaAnswer)) {
                  if (product?.fsaHsaEligible === true) {
                      parts.fsaHsa = { score: 1 };
                      reasons.push({
                          component: 'fsaHsa',
                          weight: PREFERENCE_WEIGHTS.fsaHsa,
                          score: 1,
                          text: 'FSA/HSA eligible',
                      });
                  } else if (product?.fsaHsaEligible === false) {
                      parts.fsaHsa = { score: 0 };
                  }
              }"""
          new = """    const fsaAnswer = String(intake?.fsaHsaAnswer || intake?.fsaHsa || '').trim().toLowerCase();
              const combinedEligible = product?.fsaHsaEligible === true || product?.fsa_hsa_eligible === true;
              const fsaEligible = combinedEligible || product?.fsaEligible === true || product?.fsa_eligible === true;
              const hsaEligible = combinedEligible || product?.hsaEligible === true || product?.hsa_eligible === true;
              const hasEligibilityData = [
                  product?.fsaHsaEligible, product?.fsa_hsa_eligible,
                  product?.fsaEligible, product?.fsa_eligible,
                  product?.hsaEligible, product?.hsa_eligible,
              ].some((value) => typeof value === 'boolean');
              const wantsFsa = ['fsa', 'both', 'yes'].includes(fsaAnswer);
              const wantsHsa = ['hsa', 'both', 'yes'].includes(fsaAnswer);
              if ((wantsFsa || wantsHsa) && hasEligibilityData) {
                  const eligible = (wantsFsa && fsaEligible) || (wantsHsa && hsaEligible);
                  parts.fsaHsa = { score: eligible ? 1 : 0 };
                  if (eligible) {
                      reasons.push({
                          component: 'fsaHsa',
                          weight: PREFERENCE_WEIGHTS.fsaHsa,
                          score: 1,
                          text: wantsFsa && wantsHsa ? 'FSA/HSA eligible' : `${wantsFsa ? 'FSA' : 'HSA'} eligible`,
                      });
                  }
              }"""
          assert old in text, 'FSA/HSA preference block changed unexpectedly'
          text = text.replace(old, new, 1)
          products.write_text(text)

          engine = Path('src/utils/recommendationEngine.js')
          text = engine.read_text()
          old = """export function scoreProduct(product, intake, concern) {
            const details = getProductMatchDetailsForProduct(product, intake);
            if (!details?.eligible) return -1;
            return details?.percent == null ? 0 : details.percent;
          }"""
          new = """export function scoreProduct(product, intake, concern) {
            const details = getProductMatchDetailsForProduct(product, intake);
            if (!details?.eligible) return -1;

            let score = details?.percent == null ? 0 : details.percent;
            const profile = intakeProfile(intake);
            const account = String(profile?.fsaHsaAnswer || profile?.fsaHsa || '').trim().toLowerCase();
            const eligibility = fsaHsaEligibility(product);
            const accountMatch =
              account === 'fsa' ? eligibility.fsa
                : account === 'hsa' ? eligibility.hsa
                  : account === 'both' ? (eligibility.fsa || eligibility.hsa)
                    : false;

            // A small shopping-preference boost only. It can break ties among
            // otherwise relevant products, but it does not turn FSA/HSA status
            // into a medical recommendation signal.
            if (accountMatch) score += 5;
            return score;
          }"""
          assert old in text, 'scoreProduct block changed unexpectedly'
          engine.write_text(text.replace(old, new, 1))

          test = Path('src/data/products.personalization.test.js')
          text = test.read_text()
          text = text.replace(
            "import { ALL_PRODUCTS, getRecommendations, getPersonalizedProductIds, getProductRelevanceScore } from './products';",
            "import { ALL_PRODUCTS, filterPrescriptionCareGate, getRecommendations, getPersonalizedProductIds, getProductRelevanceScore } from './products';",
            1,
          )
          old = """        // getRecommendations() intentionally pads with every zero-score product as a
                  // fallback tail (ecosystem-building always wants candidates) — so it stays
                  // the full catalog. A membership filter built from it would be a near no-op.
                  expect(full.length).toBe(ALL_PRODUCTS.length);"""
          new = """        // getRecommendations() intentionally keeps the zero-score fallback tail,
                  // but prescription-only products are removed by the safety care-path gate.
                  // Within that safe candidate set, membership would still be a near no-op.
                  expect(full.length).toBe(filterPrescriptionCareGate(ALL_PRODUCTS).length);"""
          assert old in text, 'full-catalog assertion block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """    it('can give a modest contextual score from age and life stage without pretending it is a direct need', () => {
                  expect(oura).toBeTruthy();

                  const score = getProductRelevanceScore(
                      oura,
                      { age: '35-44', frustrations: [] },
                      null
                  );

                  expect(score).toBeGreaterThan(0);
                  expect(score).toBeLessThan(50);
                  expect([0, 50, 100]).not.toContain(score);
              });"""
          new = """    it('does not turn an age band alone into a personalized product recommendation', () => {
                  expect(oura).toBeTruthy();

                  const score = getProductRelevanceScore(
                      oura,
                      { age: '35-44', frustrations: [] },
                      null
                  );

                  expect(score).toBeNull();
              });"""
          assert old in text, 'age-only personalization test changed unexpectedly'
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.js src/utils/recommendationEngine.js src/data/products.personalization.test.js
          git diff --cached --check
          git commit -m "Fix health profile and FSA recommendation scoring"
          git push origin HEAD:site-hardening-performance
