name: PR88 surgical cleanup

on:
  push:
    branches: [web-next]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: web-next
          persist-credentials: true

      - name: Apply deterministic source fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Website Home should keep opening My ecosystem. Remove the stale
          # duplicate prop that overwrote it with the old Today route.
          replace_once(
              'src/App.jsx',
              "            onViewHowItWorks={handleViewHowItWorks}\n            onViewToday={() => setCurrentView('today')}\n            user={user}",
              "            onViewHowItWorks={handleViewHowItWorks}\n            user={user}",
          )

          # 2) Web Community: give playlist owners the same metadata editing
          # parity as native (title, description, visibility).
          replace_once(
              'src/components/WebCommunity.jsx',
              "  const [playlistTitle, setPlaylistTitle] = useState('');\n  const [playlistVisibility, setPlaylistVisibility] = useState('public');\n  const [coverColor, setCoverColor] = useState(COVER_COLORS[0]);",
              "  const [playlistTitle, setPlaylistTitle] = useState('');\n  const [playlistVisibility, setPlaylistVisibility] = useState('public');\n  const [editingPlaylist, setEditingPlaylist] = useState(false);\n  const [editPlaylistTitle, setEditPlaylistTitle] = useState('');\n  const [editPlaylistDescription, setEditPlaylistDescription] = useState('');\n  const [editPlaylistVisibility, setEditPlaylistVisibility] = useState('public');\n  const [coverColor, setCoverColor] = useState(COVER_COLORS[0]);",
          )
          replace_once(
              'src/components/WebCommunity.jsx',
              "  const closePage = () => { setPage(null); setDetails(null); setComments([]); setItems([]); setError(''); setEditingProfile(false); setProfileStats(null); };",
              "  const closePage = () => { setPage(null); setDetails(null); setComments([]); setItems([]); setError(''); setEditingProfile(false); setEditingPlaylist(false); setProfileStats(null); };",
          )
          replace_once(
              'src/components/WebCommunity.jsx',
              "  const openPlaylist = async (pl) => {\n    setProductId(null); setPage({ type: 'playlist', id: pl.id }); setDetails(pl); setError(''); window.scrollTo(0, 0);",
              "  const openPlaylist = async (pl) => {\n    setEditingPlaylist(false); setProductId(null); setPage({ type: 'playlist', id: pl.id }); setDetails(pl); setError(''); window.scrollTo(0, 0);",
          )
          replace_once(
              'src/components/WebCommunity.jsx',
              "    const deletePl = async () => { setBusy(true); try { await community.deletePlaylist(supabase, details.id); closePage(); setRefresh((v) => v + 1); setNotice('Playlist deleted.'); } catch (e) { notifyError(e); } finally { setBusy(false); } };\n    const removeItem = async (pid) => {",
              "    const deletePl = async () => { setBusy(true); try { await community.deletePlaylist(supabase, details.id); closePage(); setRefresh((v) => v + 1); setNotice('Playlist deleted.'); } catch (e) { notifyError(e); } finally { setBusy(false); } };\n    const startPlaylistEdit = () => {\n      if (!mine) return;\n      setEditPlaylistTitle(details.title || '');\n      setEditPlaylistDescription(details.description || '');\n      setEditPlaylistVisibility(details.visibility || 'public');\n      setEditingPlaylist(true);\n      setError('');\n    };\n    const cancelPlaylistEdit = () => { setEditingPlaylist(false); setError(''); };\n    const savePlaylistEdit = async (event) => {\n      event?.preventDefault();\n      const title = editPlaylistTitle.trim();\n      const description = editPlaylistDescription.trim();\n      if (!mine || !title || breaksCommunityRules(title, description)) return;\n      setBusy(true); setError('');\n      try {\n        await community.updatePlaylist(supabase, details.id, { title, description, visibility: editPlaylistVisibility });\n        await refreshPlaylist(details.id);\n        setEditingPlaylist(false);\n        setNotice('Playlist updated.');\n      } catch (e) { notifyError(e); } finally { setBusy(false); }\n    };\n    const removeItem = async (pid) => {",
          )
          replace_once(
              'src/components/WebCommunity.jsx',
              "      </div>\n      <ul className=\"ay-group cm-pl-list\" aria-label=\"Products in this playlist\">",
              "      </div>\n      {mine && editingPlaylist && <form className=\"cm-pl-edit\" onSubmit={savePlaylistEdit} style={{ display: 'grid', gap: 16, margin: '18px 0 22px', padding: '18px 0', borderTop: '1px solid var(--d-hair)', borderBottom: '1px solid var(--d-hair)' }}>\n        <section className=\"cm-group\">\n          <label className=\"cm-label\" htmlFor=\"cm-pl-edit-name\">Name</label>\n          <RuleField as=\"input\" id=\"cm-pl-edit-name\" value={editPlaylistTitle} maxLength={60} onChange={(e) => setEditPlaylistTitle(e.target.value)} onShowRules={openRules} />\n        </section>\n        <section className=\"cm-group\">\n          <label className=\"cm-label\" htmlFor=\"cm-pl-edit-description\">Description</label>\n          <RuleField as=\"textarea\" id=\"cm-pl-edit-description\" autoGrow minRows={3} value={editPlaylistDescription} maxLength={240} onChange={(e) => setEditPlaylistDescription(e.target.value)} placeholder=\"Optional\" onShowRules={openRules} />\n        </section>\n        <fieldset className=\"cm-group\" style={{ border: 0, padding: 0, margin: 0 }}>\n          <legend className=\"cm-label\">Who can see it</legend>\n          <div className=\"cm-seg\" role=\"radiogroup\">{AUDIENCE.map(([value, label]) => <button type=\"button\" key={value} role=\"radio\" aria-checked={editPlaylistVisibility === value} aria-pressed={editPlaylistVisibility === value} onClick={() => setEditPlaylistVisibility(value)}>{label}</button>)}</div>\n        </fieldset>\n        {breaksCommunityRules(editPlaylistTitle, editPlaylistDescription) && <p className=\"cm-muted\">Check the highlighted text against the Community rules before saving.</p>}\n        <div className=\"cm-row\">\n          <button type=\"submit\" className=\"ay-btn ay-btn--primary\" disabled={busy || !editPlaylistTitle.trim() || breaksCommunityRules(editPlaylistTitle, editPlaylistDescription)}>{busy ? 'Saving…' : 'Save changes'}</button>\n          <button type=\"button\" className=\"ay-btn ay-btn--secondary\" disabled={busy} onClick={cancelPlaylistEdit}>Cancel</button>\n        </div>\n      </form>}\n      <ul className=\"ay-group cm-pl-list\" aria-label=\"Products in this playlist\">",
          )
          replace_once(
              'src/components/WebCommunity.jsx',
              "      {mine && <div className=\"cm-pl-owner\"><button type=\"button\" className=\"ct-link is-danger\" disabled={busy} onClick={deletePl}>Delete playlist</button></div>}",
              "      {mine && <div className=\"cm-pl-owner\"><button type=\"button\" className=\"ct-link\" disabled={busy} onClick={editingPlaylist ? cancelPlaylistEdit : startPlaylistEdit}>{editingPlaylist ? 'Cancel editing' : 'Edit playlist'}</button><button type=\"button\" className=\"ct-link is-danger\" disabled={busy} onClick={deletePl}>Delete playlist</button></div>}",
          )

          # 3) App: resolve the real section underneath Explore so service
          # prompts are service-specific, and expose suggestions on ecosystem + Saved.
          replace_once(
              'src/mobile/MobileApp.jsx',
              "  const suggestOn = !overlay && !askAynaOpen && ['explore', 'browse', 'library', 'community'].includes(screen); // Today has its own Ask bar\n  const headerValue = {",
              "  const suggestOn = !overlay && !askAynaOpen && ['explore', 'browse', 'library', 'community', 'eco', 'ecointro', 'saved'].includes(screen); // Today has its own Ask bar\n  const suggestSurface = screen === 'explore'\n    ? (exploreSection === 'services' ? 'services' : exploreSection === 'resources' ? 'library' : 'explore')\n    : screen;\n  const headerValue = {",
          )
          replace_once(
              'src/mobile/MobileApp.jsx',
              "    suggest: suggestOn ? { signedIn: Boolean(authUser?.id), hasProfile: Boolean(effectiveQuizAnswers) } : null,",
              "    suggest: suggestOn ? { signedIn: Boolean(authUser?.id), hasProfile: Boolean(effectiveQuizAnswers), surface: suggestSurface } : null,",
          )

          # 4) Profile/health: keep the dashboard visual design, but lock the
          # actual health dashboard and connection entry before free users enter.
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "import { localDayKey as rundownDayKey } from '../../../utils/localDate.js';",
              "import { localDayKey as rundownDayKey } from '../../../utils/localDate.js';\nimport { openProPaywall } from '../../../pro/paywall.js';\nimport { useProAccess } from '../../../pro/useProAccess.js';",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "  const signedIn = !!authUserId;\n  // No name yet:",
              "  const signedIn = !!authUserId;\n  const pro = useProAccess(authUserId || null);\n  const healthLocked = signedIn && !pro.checking && !pro.allowed;\n  const openHealthData = () => {\n    if (pro.checking) return;\n    if (!pro.allowed) { openProPaywall({ feature: 'wearables' }); return; }\n    onOpen('healthData');\n  };\n  const openHealthDashboard = () => {\n    if (pro.checking) return;\n    if (!pro.allowed) { openProPaywall({ feature: 'dashboard' }); return; }\n    onOpen('healthInsights');\n  };\n  // No name yet:",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "  const SETUP_GO = { quiz: onEditProfile, ecosystem: onOpenEcosystem, connect: () => onOpen('healthData'), checkin: onOpenMonthlyCheckin };",
              "  const SETUP_GO = { quiz: onEditProfile, ecosystem: onOpenEcosystem, connect: openHealthData, checkin: onOpenMonthlyCheckin };",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "      {r.value && <span className=\"ay-you-row-value\">{r.value}</span>}\n      <ChevronIcon />",
              "      {r.locked ? <span className=\"ay-you-row-value\" aria-label=\"ayna Pro required\" style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\" /><path d=\"M8.5 10V8a3.5 3.5 0 0 1 7 0v2\" /></svg>Pro</span> : r.value && <span className=\"ay-you-row-value\">{r.value}</span>}\n      <ChevronIcon />",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "    return shell('My health', <>\n      <ThisWeek authUserId={authUserId} onOpenDashboard={() => onOpen('healthInsights')} onConnect={() => onOpen('healthData')} />\n      {group('connected', 'Connected apps', [\n        { key: 'healthData', title: 'Health data', sub: 'Apple Health, Oura and uploads', value: connectedCount ? `${connectedCount} connected` : '', onClick: () => onOpen('healthData') },\n      ])}",
              "    return shell('My health', <>\n      {pro.checking ? <section className=\"ay-you-section\" aria-labelledby=\"ay-you-week\"><h2 className=\"ay-you-h2\" id=\"ay-you-week\">This week</h2><div className=\"ay-you-week is-loading\" role=\"status\">Checking Pro access…</div></section> : pro.allowed ? <ThisWeek authUserId={authUserId} onOpenDashboard={openHealthDashboard} onConnect={openHealthData} /> : <section className=\"ay-you-section\" aria-labelledby=\"ay-you-week\"><h2 className=\"ay-you-h2\" id=\"ay-you-week\">This week</h2><div className=\"ay-you-locked\"><svg className=\"ay-you-locked-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\" /><path d=\"M8.5 10V8a3.5 3.5 0 0 1 7 0v2\" /></svg><p>Your health dashboard and connected health data are included with ayna Pro.</p><button type=\"button\" className=\"ay-you-btn\" onClick={openHealthDashboard}>Get ayna Pro</button></div></section>}\n      {group('connected', 'Connected apps', [\n        { key: 'healthData', title: 'Health data', sub: healthLocked ? 'Apple Health, Oura and uploads · Pro' : 'Apple Health, Oura and uploads', value: healthLocked ? '' : connectedCount ? `${connectedCount} connected` : '', locked: healthLocked, onClick: openHealthData },\n      ])}",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "        {!signedIn && <SignedOutCard><b>Build your health ecosystem</b><br />Keep your concerns, matches, saved products and health insights connected in one place.</SignedOutCard>}\n\n        {quizDraft && onResumeQuiz",
              "        {!signedIn && <SignedOutCard><b>Build your health ecosystem</b><br />Keep your concerns, matches, saved products and health insights connected in one place.</SignedOutCard>}\n        {signedIn && !pro.checking && !pro.allowed && <section className=\"ay-you-section ay-you-group\" aria-label=\"ayna Pro\"><nav className=\"ay-you-list\"><button type=\"button\" className=\"ay-you-row\" onClick={() => openProPaywall({ feature: 'dashboard' })}><svg className=\"ay-you-row-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2L12 18.5l-2.2-5.3L4.5 11l5.3-2.2Z\" /></svg><span className=\"ay-you-row-title\">ayna Pro<small className=\"ay-you-row-sub\">Health dashboard, connected data and higher limits</small></span><span className=\"ay-you-row-value\">Upgrade</span><ChevronIcon /></button></nav></section>}\n\n        {quizDraft && onResumeQuiz",
          )

          # Keep WHOOP out of current user-facing copy while it is not a live integration.
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "          {/* Opt-in, off by default (src/health/askHealthPref.js). Oura and WHOOP data is never sent. */}\n          <ToggleRow title={ASK_HEALTH_LABEL} sub={askHealth.on ? 'On. Questions you ask from Your health can include your cycle day, next period estimate, sleep, heart and activity trends. Never Oura or WHOOP data.' : 'Off. Ask ayna answers without your cycle and sleep data.'}",
              "          {/* Opt-in, off by default (src/health/askHealthPref.js). Oura data is never sent. */}\n          <ToggleRow title={ASK_HEALTH_LABEL} sub={askHealth.on ? 'On. Questions you ask from Your health can include your cycle day, next period estimate, sleep, heart and activity trends. Oura data is never sent to Ask ayna.' : 'Off. Ask ayna answers without your cycle and sleep data.'}",
          )

          # 5) Settings search: filter existing rows and make Tips/Ask suggestions
          # discoverable without changing the visual information architecture.
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "function SettingsScreen({ onBack, onOpenTexts, onOpenPreferences, onOpenHowItWorks, onOpenAboutAyna, onOpenContact, onOpenAccountInfo, onOpenPrivacyData, onOpenLegal, authUser, onSignOut, onSignIn }) {\n  const groups = [",
              "function SettingsScreen({ onBack, onOpenTexts, onOpenPreferences, onOpenHowItWorks, onOpenAboutAyna, onOpenContact, onOpenAccountInfo, onOpenPrivacyData, onOpenLegal, authUser, onSignOut, onSignIn }) {\n  const [query, setQuery] = useState('');\n  const groups = [",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "    ['Preferences', 'butter', [{ icon: 'appearance', title: 'Appearance & preferences', onClick: onOpenPreferences }, ...(onOpenTexts ? [{ icon: 'texts', title: 'Text messages', onClick: onOpenTexts }] : [])]],\n    ['About', 'pink', [{ icon: 'how', title: 'How it works', onClick: onOpenHowItWorks }, { icon: 'about', title: 'About ayna', onClick: onOpenAboutAyna }, { icon: 'brands', title: 'Brand partnerships', href: BRAND_PARTNERSHIPS_URL }, { icon: 'campus', title: 'Campus resources', href: CAMPUS_RESOURCES_URL }]],\n    ['Account', 'mint', [{ icon: 'account', title: 'Account information', onClick: onOpenAccountInfo }, { icon: 'privacy', title: 'Privacy & data', onClick: onOpenPrivacyData }, { icon: 'legal', title: 'Legal', onClick: onOpenLegal }, { icon: 'contact', title: 'Contact', onClick: onOpenContact }]],\n  ];\n  const rowInner",
              "    ['Preferences', 'butter', [{ icon: 'appearance', title: 'Appearance & preferences', keywords: 'theme text size notifications personalization health data ask ayna suggestions tips', onClick: onOpenPreferences }, ...(onOpenTexts ? [{ icon: 'texts', title: 'Text messages', keywords: 'sms phone alerts reminders', onClick: onOpenTexts }] : [])]],\n    ['About', 'pink', [{ icon: 'how', title: 'How it works', keywords: 'matching evidence recommendations', onClick: onOpenHowItWorks }, { icon: 'about', title: 'About ayna', keywords: 'team company', onClick: onOpenAboutAyna }, { icon: 'brands', title: 'Brand partnerships', keywords: 'partners companies', href: BRAND_PARTNERSHIPS_URL }, { icon: 'campus', title: 'Campus resources', keywords: 'college university', href: CAMPUS_RESOURCES_URL }]],\n    ['Account', 'mint', [{ icon: 'account', title: 'Account information', keywords: 'email password name delete download', onClick: onOpenAccountInfo }, { icon: 'privacy', title: 'Privacy & data', keywords: 'health data analytics delete export connected', onClick: onOpenPrivacyData }, { icon: 'legal', title: 'Legal', keywords: 'privacy terms licenses policy', onClick: onOpenLegal }, { icon: 'contact', title: 'Contact', keywords: 'help support feedback partnership press', onClick: onOpenContact }]],\n  ];\n  const normalizedQuery = query.trim().toLowerCase();\n  const matchesQuery = (text) => !normalizedQuery || String(text || '').toLowerCase().includes(normalizedQuery);\n  const visibleGroups = groups.map(([title, tone, rows]) => [title, tone, rows.filter((row) => matchesQuery(`${row.title} ${row.keywords || ''}`))]).filter(([, , rows]) => rows.length);\n  const showRundown = !normalizedQuery || matchesQuery('daily rundown today notifications summary');\n  const showTips = !normalizedQuery || matchesQuery('tips help tour ask ayna suggestions appearance preferences');\n  const noResults = normalizedQuery && !visibleGroups.length && !showRundown && !showTips;\n  const rowInner",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "    <BackHeader title=\"Settings\" onBack={onBack} />\n    <div className=\"ayna-settings-scroll ay-set-scroll\">\n      {groups.map(([title, tone, rows]) => <section key={title}",
              "    <BackHeader title=\"Settings\" onBack={onBack} />\n    <div className=\"ayna-settings-scroll ay-set-scroll\">\n      <label className=\"ay-set-search\" aria-label=\"Search settings\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\" /><path d=\"m16 16 4.5 4.5\" /></svg><input type=\"search\" value={query} onChange={(e) => setQuery(e.target.value)} placeholder=\"Search settings\" autoCapitalize=\"none\" /></label>\n      {visibleGroups.map(([title, tone, rows]) => <section key={title}",
          )
          replace_once(
              'src/mobile/screens/profile/ProfileFlow.jsx',
              "      <RundownSetting today={rundownDayKey()} />\n      <TipsSettings renderSwitch={(p) => <Toggle {...p} />} />\n      <button type=\"button\" className={`ayna-account-session ay-set-session${authUser ? ' is-out' : ''}`}",
              "      {showRundown && <RundownSetting today={rundownDayKey()} />}\n      {showTips && <TipsSettings renderSwitch={(p) => <Toggle {...p} />} />}\n      {noResults && <p className=\"ay-set-no-results\" role=\"status\">No settings match “{query.trim()}”.</p>}\n      <button type=\"button\" className={`ayna-account-session ay-set-session${authUser ? ' is-out' : ''}`}",
          )

          # Settings search uses the existing flat settings language, not a new card.
          css = Path('src/mobile/settings.css')
          css_text = css.read_text()
          marker = '/* PR88 settings search */'
          if marker not in css_text:
              css.write_text(css_text + "\n\n/* PR88 settings search */\n.ayna-mobile .ay-set-search { display:flex; align-items:center; gap:10px; margin:4px 0 18px; padding:0 2px 10px; border-bottom:1px solid var(--d-hair); color:var(--ayna-text-muted); }\n.ayna-mobile .ay-set-search svg { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; }\n.ayna-mobile .ay-set-search input { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--ayna-text); font:500 max(16px, calc(15px * var(--ayna-text-scale, 1)))/1.4 var(--ayna-font-ui); padding:8px 0; }\n.ayna-mobile .ay-set-search input::placeholder { color:var(--ayna-text-faint); }\n.ayna-mobile .ay-set-no-results { margin:30px 4px; color:var(--ayna-text-muted); font-size:calc(13px * var(--ayna-text-scale, 1)); line-height:1.5; text-align:center; }\n")

          # Focused assertions before committing.
          assert Path('src/App.jsx').read_text().count('onViewToday=') >= 1
          app_block = Path('src/App.jsx').read_text()
          assert 'onViewToday={() => setCurrentView(\'today\')}' not in app_block
          community_text = Path('src/components/WebCommunity.jsx').read_text()
          assert 'Save changes' in community_text and 'community.updatePlaylist' in community_text
          profile_text = Path('src/mobile/screens/profile/ProfileFlow.jsx').read_text()
          assert 'Search settings' in profile_text and "feature: 'wearables'" in profile_text and 'Upgrade' in profile_text
          mobile_text = Path('src/mobile/MobileApp.jsx').read_text()
          assert 'surface: suggestSurface' in mobile_text
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/WebCommunity.jsx src/mobile/MobileApp.jsx src/mobile/screens/profile/ProfileFlow.jsx src/mobile/settings.css
          git diff --cached --check
          git commit -m "Finish PR88 community, Pro entry and settings cleanup"
          git push origin HEAD:web-next
