name: V6 Signed-out Interaction QA

on:
  push:
    branches:
      - ameera/v6-real-site-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build redesign branch
        run: npm run build

      - name: Start redesign preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ayna-after.log 2>&1 &
          echo $! > /tmp/ayna-after.pid

      - name: Run signed-out first-click QA
        run: node scripts/qa-v6-signedout-interactions.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AYNA_AFTER_URL: http://127.0.0.1:4173

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-signedout-interactions
          path: artifacts/v6-signedout-interactions
          if-no-files-found: warn
