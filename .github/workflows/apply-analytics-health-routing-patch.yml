name: Apply analytics and health routing patch

on:
  push:
    branches:
      - analytics-health-knowledge-routing
    paths:
      - .github/workflows/apply-analytics-health-routing-patch.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-health-knowledge-routing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Unit and integration tests
        run: npm test -- --reporter=verbose
      - name: Verify catalog export
        run: npm run catalog:check
      - name: Production build
        run: npm run build
