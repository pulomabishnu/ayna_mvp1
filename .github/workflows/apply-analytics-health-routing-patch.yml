name: Apply analytics and health routing patch

on:
  push:
    branches:
      - analytics-health-knowledge-routing
    paths:
      - scripts/apply-analytics-health-routing-patch.mjs
      - scripts/fix-analytics-consent-patch.mjs
      - .github/workflows/apply-analytics-health-routing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-health-knowledge-routing
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Apply deterministic source patch
        run: |
          node scripts/apply-analytics-health-routing-patch.mjs
          node scripts/fix-analytics-consent-patch.mjs

      - name: Run tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose > audit-test-output.txt 2>&1
          code=$?
          cat audit-test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: audit-test-output
          path: audit-test-output.txt

      - name: Stop on test failure
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

      - name: Production build
        run: npm run build

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply-analytics-health-routing-patch.mjs
          rm scripts/fix-analytics-consent-patch.mjs
          rm .github/workflows/apply-analytics-health-routing-patch.yml
          rm -f audit-test-output.txt

      - name: Commit patched sources
        run: |
          git config user.name "ayna-ci"
          git config user.email "noreply@aynahealth.co"
          git add -A
          git commit -m "Make analytics opt-out and keep health search first-party"
          git push origin HEAD:analytics-health-knowledge-routing
