name: One-time age 18 source patch

on:
  push:
    branches:
      - quiz-age-18

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: quiz-age-18
      - name: Patch age control
        run: node scripts/oneoff-age18.cjs
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'min="18" max="90"' src/components/HealthIntakeForm.jsx
          ! grep -F 'Math.max(13' src/components/HealthIntakeForm.jsx
      - name: Commit source fix
        run: |
          git config user.name "ayna-ci"
          git config user.email "noreply@aynahealth.co"
          git add src/components/HealthIntakeForm.jsx
          git commit -m "Set ecosystem quiz minimum age to 18"
          git push origin HEAD:quiz-age-18
