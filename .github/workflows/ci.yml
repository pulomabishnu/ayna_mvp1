name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Unit and integration tests
        run: npm test -- --reporter=verbose

      - name: Verify catalog export
        run: npm run catalog:check

      - name: Production build
        run: npm run build

      - name: Verify native analytics bundle
        run: node scripts/verify-native-analytics-build.mjs

      - name: Validate historical recovery script syntax
        run: node --check scripts/recover-posthog-history.mjs
