name: V6 Master Visual Audit

on:
  push:
    branches:
      - ameera/v6-real-site-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install redesign dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build redesign branch
        run: npm run build

      - name: Start redesign preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ayna-master-after.log 2>&1 &
          echo $! > /tmp/ayna-master-after.pid

      - name: Prepare current main build
        run: |
          git fetch origin main
          git worktree add --detach /tmp/ayna-master-main origin/main
          cd /tmp/ayna-master-main
          npm ci
          npm run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Start current main preview
        run: |
          cd /tmp/ayna-master-main
          nohup npx vite preview --host 127.0.0.1 --port 4174 > /tmp/ayna-master-before.log 2>&1 &
          echo $! > /tmp/ayna-master-before.pid

      - name: Capture real local before and after screenshots
        run: node scripts/capture-v6-master-audit.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AYNA_BEFORE_URL: http://127.0.0.1:4174
          AYNA_AFTER_URL: http://127.0.0.1:4173

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-master-visual-audit
          path: artifacts/v6-master-audit
          if-no-files-found: error
