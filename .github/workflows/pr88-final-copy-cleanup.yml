name: PR88 final copy cleanup

on:
  push:
    branches: [web-next]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: web-next
          persist-credentials: true
      - name: Fix stale copy and simplify the follow-up migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceOnce(path, oldText, newText) {
            let text = fs.readFileSync(path, 'utf8');
            const count = text.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one match, found ${count}`);
            fs.writeFileSync(path, text.replace(oldText, newText));
          }

          replaceOnce(
            'src/components/ProductModal.jsx',
            "setError('Sign in to ask ayna about this product. Free accounts get a few AI chats each week.');",
            "setError('Sign in to ask ayna about this product. Free accounts get 5 Ask ayna chats a month.');",
          );
          replaceOnce(
            'src/components/ProfileChatbot.jsx',
            "setSendError('Sign in to ask ayna anything. Free accounts get a few chats each week.');",
            "setSendError('Sign in to ask ayna anything. Free accounts get 5 Ask ayna chats a month.');",
          );
          replaceOnce(
            'src/mobile/components/AskAynaModal.jsx',
            "<p>Your cycle and sleep data goes to ayna’s AI only if you turn it on. Oura and WHOOP data is never sent.</p>",
            "<p>Your cycle and sleep data goes to ayna’s AI only if you turn it on. Oura data is never sent.</p>",
          );
          replaceOnce(
            'src/mobile/components/AskAynaModal.jsx',
            "'Your next questions here can use your cycle and sleep data. Oura and WHOOP data is never sent.'",
            "'Your next questions here can use your cycle and sleep data. Oura data is never sent.'",
          );

          fs.writeFileSync('supabase/migrations/20261028005500_pro_quiz_monthly_retakes.sql', `begin;

-- The preceding 20261027160000 migration already changes Free quiz retakes
-- from weekly to one per UTC calendar month. This follow-up only retires the
-- old weekly-named supporting index and recreates it with a name that matches
-- the live monthly rule. No behavior or existing rows are changed here.

drop index if exists public.user_ecosystem_builds_weekly_retakes_idx;
create index if not exists user_ecosystem_builds_monthly_retakes_idx
  on public.user_ecosystem_builds(user_id, created_at)
  where is_initial = false;

commit;
`);
          NODE
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -RIn --exclude-dir=node_modules -E "Free accounts get a few (AI )?chats each week|Oura and WHOOP data is never sent" src && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProductModal.jsx src/components/ProfileChatbot.jsx src/mobile/components/AskAynaModal.jsx supabase/migrations/20261028005500_pro_quiz_monthly_retakes.sql
          git commit -m "Finish PR88 quota copy and monthly migration cleanup"
          git push origin HEAD:web-next
