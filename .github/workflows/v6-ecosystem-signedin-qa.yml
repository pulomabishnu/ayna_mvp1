name: V6 Signed-in Ecosystem QA

on:
  push:
    branches:
      - ameera/v6-real-site-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build isolated signed-in QA fixture
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://qaproject.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiZXhwIjo0MTAyNDQ0ODAwfQ.fake

      - name: Serve exact branch build
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ayna-v6-qa-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ayna-v6-qa-preview.log || true
          exit 1

      - name: Run signed-in ecosystem QA five times
        run: node scripts/qa-v6-signedin-ecosystem-v2.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AYNA_AFTER_URL: http://127.0.0.1:4173

      - name: Upload ecosystem QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-ecosystem-signedin-qa
          path: artifacts/v6-ecosystem-signedin-qa
          if-no-files-found: error
