name: Apple compliance pass

on:
  push:
    branches:
      - privacy/apple-app-store-compliance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic compliance patches
        run: |
          node scripts/apply-apple-compliance-patches.mjs
          node scripts/apply-apple-compliance-patches-2.mjs
          node scripts/apply-apple-compliance-patches-3.mjs
          node scripts/apply-apple-compliance-patches-4.mjs
          node scripts/apply-apple-compliance-patches-5.mjs
      - name: Inspect working tree
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Privacy, AI, catalog, and auth regression tests
        run: |
          npx vitest run \
            api/_privacyConsent.test.js \
            api/_llm.test.js \
            api/ask-ayna.integration.test.js \
            api/product-chat.integration.test.js \
            api/product-insights.integration.test.js \
            api/llm-recommendations.integration.test.js \
            api/search-suggestions.integration.test.js \
            api/sms-webhook.integration.test.js \
            src/utils/posthogPrivacy.test.js \
            src/utils/aiHealthContext.test.js \
            src/utils/userHealthContextForInsights.test.js \
            src/utils/productCatalog.test.js
      - name: Full repository test suite
        run: npx vitest run
      - name: Production web build
        run: npm run build
      - name: Full lint
        run: npm run lint
      - name: Commit verified patch output
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/AuthGate.jsx \
            src/mobile/hooks/useSupabaseAuth.js \
            src/mobile/screens/SigninScreen.jsx \
            src/mobile/MobileApp.jsx \
            src/mobile/screens/ProductDetailScreen.jsx \
            src/mobile/screens/profile/ProfileFlow.jsx \
            src/App.jsx \
            src/utils/productCatalog.js \
            src/utils/fetchSearchSuggestions.js \
            src/utils/userHealthContextForInsights.js \
            src/utils/posthogPrivacy.js \
            api/_test-helpers.js \
            api/_privacyConsent.test.js \
            api/_llm.js \
            api/ask-ayna.js \
            api/product-chat.js \
            api/product-chat.integration.test.js \
            api/product-insights.js \
            api/product-insights.integration.test.js \
            api/llm-recommendations.js \
            api/llm-recommendations.integration.test.js \
            api/search-suggestions.js \
            api/search-suggestions.integration.test.js \
            api/sms-webhook.js \
            api/products.js \
            ios/App/App.xcodeproj/project.pbxproj
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated patch changes to commit."
          else
            git commit -m "privacy: apply Apple compliance and shared catalog fixes"
            git push origin HEAD:privacy/apple-app-store-compliance
          fi

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic compliance patches
        run: |
          node scripts/apply-apple-compliance-patches.mjs
          node scripts/apply-apple-compliance-patches-2.mjs
          node scripts/apply-apple-compliance-patches-3.mjs
          node scripts/apply-apple-compliance-patches-4.mjs
          node scripts/apply-apple-compliance-patches-5.mjs
      - name: Build web bundle and sync Capacitor
        run: |
          npm run build
          npx cap sync ios
      - name: Validate plist files
        run: |
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/App.entitlements
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
