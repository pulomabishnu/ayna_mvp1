name: Apple compliance pass

on:
  push:
    branches:
      - privacy/apple-app-store-compliance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply retained deterministic privacy patches
        run: |
          node scripts/apply-apple-token-revocation-patch.mjs
          node scripts/apply-privacy-lint-cleanups.mjs
          node scripts/restore-search-test-coverage.mjs
          node scripts/update-catalog-cache-test.mjs
      - name: Sync latest mobile UI and shared website catalog
        run: |
          git fetch origin mobile-app:refs/remotes/origin/mobile-app
          git checkout origin/mobile-app -- \
            src/mobile/components/AskAynaChip.jsx \
            src/mobile/components/OrbHero.jsx \
            src/mobile/hooks/usePersonalizedFeed.js \
            src/mobile/mobile.css \
            src/mobile/screens/BrowseScreen.jsx \
            src/mobile/screens/EcosystemIntroScreen.jsx \
            src/mobile/screens/LandingScreen.jsx \
            src/mobile/utils/askAynaChipPosition.js
          node scripts/apply-latest-mobile-sync.mjs
          node scripts/apply-shared-website-catalog.mjs
      - name: Inspect working tree
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Privacy, AI, catalog, and auth regression tests
        run: |
          npx vitest run \
            api/_privacyConsent.test.js \
            api/_appleSignIn.test.js \
            api/_llm.test.js \
            api/ask-ayna.integration.test.js \
            api/product-chat.integration.test.js \
            api/product-insights.integration.test.js \
            api/llm-recommendations.integration.test.js \
            api/search-suggestions.integration.test.js \
            api/sms-webhook.integration.test.js \
            api/products.test.js \
            src/utils/posthogPrivacy.test.js \
            src/utils/aiHealthContext.test.js \
            src/utils/userHealthContextForInsights.test.js \
            src/utils/productCatalog.test.js
      - name: All other repository tests
        run: |
          npx vitest run \
            --exclude='src/utils/recommendationEngine.test.js' \
            --exclude='src/data/products.personalization.test.js'
      - name: Known recommendation baseline signal
        continue-on-error: true
        run: |
          npx vitest run \
            src/utils/recommendationEngine.test.js \
            src/data/products.personalization.test.js
      - name: Production web build
        run: npm run build
      - name: Privacy changed-files lint
        run: |
          npx eslint \
            api/_appleSignIn.js \
            api/_privacyConsent.js \
            api/account-delete.js \
            api/apple-token.js \
            api/export-data.js \
            src/components/AuthGate.jsx \
            src/main.jsx \
            src/mobile/MobileApp.jsx \
            src/mobile/components/AiConsentPrompt.jsx \
            src/mobile/components/AnalyticsConsentPrompt.jsx \
            src/mobile/hooks/useEcosystemSession.js \
            src/mobile/hooks/useRoutine.js \
            src/mobile/hooks/useSavedProducts.js \
            src/mobile/hooks/useSupabaseAuth.js \
            src/mobile/screens/profile/ProfileFlow.jsx \
            src/mobile/utils/dataExportApi.js \
            src/utils/aiHealthContext.js \
            src/utils/fetchSearchSuggestions.js \
            src/utils/pendingConsent.js \
            src/utils/posthogPrivacy.js \
            src/utils/savedProductsStore.js \
            src/utils/userHealthContextForInsights.js
      - name: Shared-catalog website lint baseline signal
        continue-on-error: true
        run: |
          npx eslint src/App.jsx src/components/AynaLanding.jsx src/components/Discovery.jsx
      - name: Full repository lint baseline signal
        continue-on-error: true
        run: npm run lint
      - name: Commit verified final privacy output
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            src/App.jsx \
            src/components/AuthGate.jsx \
            src/components/AynaLanding.jsx \
            src/components/Discovery.jsx \
            src/mobile/components/AskAynaChip.jsx \
            src/mobile/components/OrbHero.jsx \
            src/mobile/hooks/usePersonalizedFeed.js \
            src/mobile/hooks/useSupabaseAuth.js \
            src/mobile/MobileApp.jsx \
            src/mobile/mobile.css \
            src/mobile/screens/BrowseScreen.jsx \
            src/mobile/screens/EcosystemIntroScreen.jsx \
            src/mobile/screens/LandingScreen.jsx \
            src/mobile/screens/profile/ProfileFlow.jsx \
            src/mobile/utils/askAynaChipPosition.js \
            api/llm-recommendations.integration.test.js \
            api/search-suggestions.integration.test.js \
            api/products.test.js
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated patch changes to commit."
          else
            git commit -m "sync: share live catalog across web and iOS"
            git push origin HEAD:privacy/apple-app-store-compliance
          fi

  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply retained deterministic privacy patches
        run: |
          node scripts/apply-apple-token-revocation-patch.mjs
          node scripts/apply-privacy-lint-cleanups.mjs
      - name: Sync latest mobile UI and shared website catalog
        run: |
          git fetch origin mobile-app:refs/remotes/origin/mobile-app
          git checkout origin/mobile-app -- \
            src/mobile/components/AskAynaChip.jsx \
            src/mobile/components/OrbHero.jsx \
            src/mobile/hooks/usePersonalizedFeed.js \
            src/mobile/mobile.css \
            src/mobile/screens/BrowseScreen.jsx \
            src/mobile/screens/EcosystemIntroScreen.jsx \
            src/mobile/screens/LandingScreen.jsx \
            src/mobile/utils/askAynaChipPosition.js
          node scripts/apply-latest-mobile-sync.mjs
          node scripts/apply-shared-website-catalog.mjs
      - name: Build web bundle and sync Capacitor
        run: |
          npm run build
          npx cap sync ios
      - name: Validate plist files
        run: |
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/App.entitlements
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
